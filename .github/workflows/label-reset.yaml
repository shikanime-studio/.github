name: Label reset
permissions:
  contents: read
"on":
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: check
        description: check reports deviations only; apply converges to the canonical table
        options:
          - check
          - apply
  schedule:
    - cron: "17 4 * * 1"

jobs:
  reset:
    name: Reset labels (${{ inputs.mode || 'check' }})
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch input; write-access-only, but kept out of run: per injection guidance
      MODE: ${{ inputs.mode || 'check' }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-administration: read
          permission-issues: write
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: actions/checkout@v5
      - name: Run label reset
        env:
          GH_TOKEN: ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN }}
        run: bash scripts/reset-labels.sh "$MODE"
